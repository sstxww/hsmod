<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">HsMod Config Preprocessor</title>
  <desc id="desc">A dark blue and gold banner for the HsMod configuration port preprocessor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b172a"/>
      <stop offset=".58" stop-color="#142a4a"/>
      <stop offset="1" stop-color="#3f2b18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c873"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="1010" cy="208" r="150" fill="none" stroke="#d9a441" stroke-width="2" opacity=".32"/>
  <circle cx="1010" cy="208" r="110" fill="#08111f" stroke="#f7c873" stroke-width="4"/>
  <text x="1010" y="184" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">AVAILABLE PORT</text>
  <text x="1010" y="240" text-anchor="middle" fill="url(#gold)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="48" font-weight="750">58744+</text>
  <g fill="#f7c873" opacity=".75">
    <circle cx="820" cy="82" r="5"/><circle cx="1122" cy="74" r="4"/><circle cx="862" cy="350" r="4"/><circle cx="1150" cy="318" r="5"/>
  </g>
  <text x="82" y="166" fill="#fff7df" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="760">HsMod Config Preprocessor</text>
  <text x="82" y="220" fill="#fde68a" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="28">为 HsMod.cfg 选择端口并更新“网站端口”</text>
  <text x="82" y="278" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">.NET 8 · Windows · single-purpose console utility</text>
</svg>